<ion-grid>
  <ion-row class="ion-margin-top">
    <ion-col size="12">
      <ion-list>
        <ion-item lines="none" class="pin-item">
          <div class="pin-input-wrapper">
            <ion-label position="stacked">{{ 'Enter your backup PIN:' | translate }}</ion-label>
            <ion-input-otp length="6" type="number" fill="solid" class="pin-input" id="otpInput"
              [(ngModel)]="pinSetup" (ionInput)="maskPin($event)"
              (ionInput)="onPinSetup($event)"></ion-input-otp>
          </div>
        </ion-item>
      </ion-list>
    </ion-col>
  </ion-row>
  <ion-row class="ion-margin-top">
    <ion-col size="12">
      <div class="primary-button-wrapper">
        <ion-button expand="block" class="ion-margin-bottom" size="default" (click)="restore()" [disabled]="isProcessing">
          @if (isProcessing) {
          <ion-spinner name="lines" slot="start"></ion-spinner>&nbsp;
          }
          {{ isProcessing ? ('Restoring...' | translate) : ('Restore from Google Drive' | translate) }}
        </ion-button>
      </div>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="12">
      <div class="ion-text-center security-tips">
        <ion-icon name="shield-checkmark"></ion-icon>
        <span style="font-size: 15px;">{{ 'Your data is encrypted locally' | translate }}</span>
      </div>
    </ion-col>
  </ion-row>
</ion-grid>
