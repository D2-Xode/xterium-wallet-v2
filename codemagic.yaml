workflows:
  ios-capacitor:
    name: Xterium iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_signing # define in Codemagic UI: CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.xterium.wallet"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build Angular/Ionic web assets
        script: npm run build
      - name: Sync web assets into the iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up keychain and import signing certificate
        script: |
          keychain initialize
          echo "$CM_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > /tmp/certificate.p12
          if [ ! -s /tmp/certificate.p12 ]; then
            echo "ERROR: /tmp/certificate.p12 is empty after decoding CM_CERTIFICATE." >&2
            echo "The CM_CERTIFICATE env var likely does not contain a complete, valid base64 string." >&2
            exit 1
          fi
          file /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Install provisioning profile
        script: |
          echo "$CM_PROVISIONING_PROFILE" | tr -d '[:space:]' | base64 --decode > /tmp/profile.mobileprovision
          if [ ! -s /tmp/profile.mobileprovision ]; then
            echo "ERROR: /tmp/profile.mobileprovision is empty after decoding CM_PROVISIONING_PROFILE." >&2
            exit 1
          fi
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          cp /tmp/profile.mobileprovision "$PROFILES_HOME"
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ken@rocksontech.com
        notify:
          success: true
          failure: true
      # Uncomment once an App Store Connect integration is configured in the
      # Codemagic dashboard to auto-upload to TestFlight instead of just
      # producing a downloadable .ipa artifact.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
